name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: PHP lint, JS syntax and plugin check
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: wordpress
          MYSQL_DATABASE: wordpress
        ports:
          - 3307:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pwordpress"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: whitelabel-login-customizer

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: wp-cli
          coverage: none

      - name: Install latest WP-CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL -o "$HOME/.local/bin/wp" https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x "$HOME/.local/bin/wp"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/wp" --version

      - name: Set up WordPress for plugin check
        run: |
          wp core download --path=wp --version=latest
          wp config create --path=wp --dbname=wordpress --dbuser=root --dbpass=wordpress --dbhost=127.0.0.1:3307 --skip-check
          wp core install --path=wp \
            --url=http://example.test \
            --title=CI \
            --admin_user=admin \
            --admin_password=password \
            --admin_email=admin@example.test \
            --skip-email

      - name: Copy plugin into WordPress
        run: |
          mkdir -p wp/wp-content/plugins
          rsync -a \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.gitignore' \
            --exclude='.gitattributes' \
            whitelabel-login-customizer/ wp/wp-content/plugins/whitelabel-login-customizer/

      - name: PHP lint
        run: find whitelabel-login-customizer -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: JavaScript syntax check
        run: node --check whitelabel-login-customizer/admin/js/admin.js

      - name: WordPress plugin check
        run: wp plugin check whitelabel-login-customizer --path=wp --format=table
