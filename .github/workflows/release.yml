name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and release plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build plugin ZIP
        run: |
          git archive --format=zip --prefix=whitelabel/ --output=whitelabel.zip "$GITHUB_REF_NAME"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: whitelabel.zip
          generate_release_notes: true
          draft: false
          prerelease: false
